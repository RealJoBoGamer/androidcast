name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: ./gradlew testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: androidcast-apks
          path: |
            display/build/outputs/apk/release/display-release.apk
            controller/build/outputs/apk/release/controller-release.apk
